# Monitor Definitions
ltm monitor http /Common/http-health-monitor {
    interval 10
    timeout 30
    send "GET /health HTTP/1.1\r\nHost: example.com\r\nConnection: Close\r\n\r\n"
    recv "200 OK"
    description "HTTP Health Check"
}

ltm monitor https /Common/https-health-monitor {
    interval 10
    timeout 30
    send "GET /health HTTP/1.1\r\nHost: example.com\r\nConnection: Close\r\n\r\n"
    recv "200 OK"
    description "HTTPS Health Check"
}

ltm monitor tcp /Common/tcp-health-monitor {
    interval 5
    timeout 16
    description "TCP Port Health Check"
}

ltm monitor icmp /Common/icmp-monitor {
    interval 5
    timeout 15
    description "ICMP Ping Monitor"
}

ltm monitor http /Common/http-monitor-unused {
    interval 10
    timeout 30
    send "GET / HTTP/1.0\r\n\r\n"
    recv "Welcome"
    description "UNUSED Monitor"
}

