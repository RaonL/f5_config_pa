# Pool Definitions
ltm pool /Common/www-web-pool {
    members {
        /Common/10.10.1.10:80 {
            address 10.10.1.10
            monitor /Common/http-health-monitor
            session monitor-enabled
            state up
        }
        /Common/10.10.1.11:80 {
            address 10.10.1.11
            monitor /Common/http-health-monitor
            session monitor-enabled
            state up
        }
        /Common/10.10.1.12:80 {
            address 10.10.1.12
            monitor /Common/http-health-monitor
            session monitor-enabled
            state down
        }
    }
    monitor /Common/http-health-monitor
    load-balancing-mode round-robin
    description "Web Server Pool (3 Nodes)"
}

