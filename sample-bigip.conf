# iRules
ltm rule /Common/api-rate-lint {
    # Rate limiting iRule for API
    when HTTP_REQUEST {
        log local0. "API Rate Limit Check"
    }
}

ltm rule /Common/http-to-https-redirect {
    # HTTP to HTTPS Redirect iRule
    when HTTP_REQUEST {
        if { [HTTP::uri] starts_with "/secure" } {
            HTTP::redirect "https://[getfield [HTTP::host] : 1][HTTP::uri]"
        }
    }
}

